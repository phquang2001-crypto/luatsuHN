 const list=(PASSAGES[topic]&&PASSAGES[topic][level])||[];
 const used=usedFor(topic,level);
 const avail=list.map((_,i)=>i).filter(i=>!used.includes(i));
 if(!avail.length)return null;
 return avail[Math.floor(Math.random()*avail.length)];
}
function ensureCurrent(){
 const topics=(S.topics&&S.topics.length)?S.topics:Object.keys(PASSAGES);
 if(S.cur&&topics.includes(S.cur.topic)){
  const list=(PASSAGES[S.cur.topic]&&PASSAGES[S.cur.topic][S.level])||[];
  if(S.cur.idx<list.length&&!usedFor(S.cur.topic,S.level).includes(S.cur.idx))return;
 }
 for(const t of topics){const idx=pickPassageIdx(t,S.level);if(idx!=null){S.cur={topic:t,idx};return}}
 S.cur=null;
}
function currentPassage(){
 ensureCurrent();
 if(!S.cur)return null;
 const list=(PASSAGES[S.cur.topic]&&PASSAGES[S.cur.topic][S.level])||[];
 if(S.cur.idx>=list.length)return null;
 return {topic:S.cur.topic,idx:S.cur.idx,level:S.level,text:list[S.cur.idx],key:S.cur.topic+"-"+S.level+"-"+S.cur.idx};
}

let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices()||[]}catch(e){VOICES=[]}}
if(typeof speechSynthesis!=="undefined"){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function pickVoice(accent,gender){
 const lang=accent==="British"?"en-GB":"en-US";
 const fem=/female|woman|zira|samantha|karen|serena|susan|victoria|tessa|fiona|moira|kate|emma|amy|joanna|salli|kendra|allison/i;
 const male=/male(?!\w)|^man$|man\b|david|daniel|alex(?!a)|george|james|oliver|fred|arthur|rishi|matthew|brian|russell|james/i;
 let pool=VOICES.filter(v=>v.lang&&v.lang.toLowerCase()===lang.toLowerCase());
 if(!pool.length)pool=VOICES.filter(v=>v.lang&&v.lang.toLowerCase().startsWith("en"));
 let match=pool.find(v=>gender==="Woman"?fem.test(v.name):male.test(v.name));
 if(!match)match=pool.find(v=>gender==="Woman"?!male.test(v.name):true);
 if(!match)match=pool[0]||VOICES.find(v=>v.lang&&v.lang.toLowerCase().startsWith("en"))||VOICES[0];
 return match;
}

 if(v){u.voice=v;u.lang=v.lang}else{u.lang=S.voice.accent==="British"?"en-GB":"en-US"}

function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const STOP=new Set(["the","a","an","is","are","was","were","be","been","being","to","of","in","on","at","and","or","but","for","with","as","it","its","this","that","these","those","i","you","he","she","they","we","my","your","their","our","his","her","not","so","if","than","then","from","by","into","out","up","down","over","after","before","about","also","can","could","will","would","should","do","does","did","has","have","had","who","what","when","where","how","which","there","here","very","just","more","most","some","any","no","one","two","three","four","five"]);
function buildBlanks(text,key){
 const sentences=text.split(/(?<=[.!?])\s+/).filter(Boolean);
 let out=[],bid=0;
 sentences.forEach((sent,si)=>{
  const words=sent.split(" ");
  const cand=[];
  words.forEach((w,wi)=>{const core=w.replace(/^[^A-Za-z']+|[^A-Za-z']+$/g,"");if(wi>0&&core.length>=4&&!STOP.has(core.toLowerCase()))cand.push(wi)});
  const n=words.length>=10?2:words.length>=4?1:0;
  const rng=mulberry32(hashStr(key+"-"+si));
  const chosen=new Set();
  const pool=cand.length?cand.slice():words.map((_,i)=>i).filter(i=>i>0&&words[i].replace(/[^A-Za-z']/g,"").length>=3);
  while(chosen.size<Math.min(n,pool.length)){const idx=pool[Math.floor(rng()*pool.length)];chosen.add(idx)}
  const toks=words.map((w,wi)=>{
   const m=w.match(/^([^A-Za-z']*)([A-Za-z'\-]*)([^A-Za-z']*)$/)||["",w,"",""];
   const [,pre,core,suf]=m;
   if(chosen.has(wi)&&core){return {blank:true,id:"b"+(bid++),pre,core,suf}}
   return {blank:false,text:w};
  });
  out.push(toks);
 });
 return out;
}

}

async function askSample(input){
 let sample;
 try{sample=await claude.use("sample")}catch(e){sample=null}
 if(!sample)return {error:"unavailable"};
 try{return await sample.json(input)}
 catch(e){return {error:(e&&e.code)||"error"}}
}
function writeSpellPrompt(topic,level,text){
 return `You are a supportive English teacher helping a ${level} level English learner practise writing. They wrote this short paragraph on the topic "${topic}":\n"""\n${text}\n"""\nReturn ONLY valid JSON, no other text, in exactly this shape:\n{"misspelled":[{"word":"<word exactly as they wrote it>","correct":"<correct spelling>"}],"improved":"<a rewritten version of their paragraph, 3 to 5 sentences, with correct spelling and grammar, using vocabulary and sentence structure suited to a ${level} level learner, keeping their original ideas and meaning>"}\nOnly list genuine spelling mistakes in "misspelled" (not grammar issues, not names). Use an empty array if there are none.`;
}

function highlightMistakes(text,ms){
 if(!ms||!ms.length)return esc(text);
 const words=new Set(ms.map(m=>(m.word||"").toLowerCase()));
 return text.split(" ").map(w=>{
  const core=w.replace(/^[^A-Za-z']+|[^A-Za-z']+$/g,"");
  if(core&&words.has(core.toLowerCase())){
   const m=ms.find(x=>(x.word||"").toLowerCase()===core.toLowerCase());
   return `<mark title="Correct: ${escA((m&&m.correct)||"")}">${esc(w)}</mark><span class="ans">(${esc((m&&m.correct)||"")})</span>`;
  }
  return esc(w);
 }).join(" ");
}

const camUrl=w=>"https://dictionary.cambridge.org/search/english/direct/?q="+encodeURIComponent(w.trim());
function addWord(w){w=(w||"").trim().toLowerCase();if(!w)return false;S.notes=S.notes||[];if(S.notes.some(n=>n.g==="Word"&&(n.t.toLowerCase()===w||n.t.toLowerCase().startsWith(w+" /"))))return "dup";S.notes.push({id:Date.now(),d:today(),g:"Word",s:"General",t:w});save();if(S.tab==="notes"&&$("#nlist"))renderList();return true}
function wordForm(){return `<div style="padding:4px 0 14px"><p><b>Look up a word</b></p><input id="lw" placeholder="e.g. sustainable" aria-label="Word to look up"><div style="display:flex;gap:8px;margin-top:8px"><a class="ghost" id="lc" target="_blank" rel="noopener noreferrer" href="#">Cambridge</a><button class="ghost" id="lsv">Save as note</button></div><p class="mute" id="lm">Tip: highlight any word on this page to look it up or save it. Saved words go to General.</p></div>`}
function bindWF(){const i=$("#lw"),c=$("#lc");if(!i)return;c.onclick=e=>{if(!i.value.trim()){e.preventDefault();i.focus()}};i.oninput=()=>{c.href=camUrl(i.value)};$("#lsv").onclick=()=>{const r=addWord(i.value);$("#lm").textContent=r===true?"Saved as a Word note.":r==="dup"?"Already saved.":"Type a word first.";if(r===true)i.value=""}}
const NS=[...SK],NT=["Mistake","Tip","Question","Word"],PG=20;
const rxe=t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const hl=(t,q)=>{if(!q)return esc(t);return t.split(new RegExp("("+rxe(q)+")","gi")).map((x,i)=>i%2?`<mark>${esc(x)}</mark>`:esc(x)).join("")};
function renderList(){
 const q=(S.nq||"").trim(),ql=q.toLowerCase(),act=!!(q||S.nt);
 S.open=S.open||{};S.pg=S.pg||{};
 const dir=S.ns==="old"?1:-1;let matches=0;
 const html=NS.map(k=>{
  const all=S.notes.filter(n=>(n.s||"General")===k);
  const L=all.filter(n=>(!S.nt||n.g===S.nt)&&(!ql||n.t.toLowerCase().includes(ql))).sort((a,b)=>dir*(a.id-b.id));
  if(act&&!L.length)return "";
  matches+=L.length;
  const pg=S.pg[k]||PG,open=act||!!S.open[k];
  const items=L.slice(0,pg).map(n=>`<div class="ni"><button class="del" data-x="${n.id}" aria-label="Delete note">Delete</button><span class="tag">${n.g}</span> <span class="mute">${n.d}</span><p>${hl(n.t,q)}</p>${n.g==="Word"?`<a class="ghost" target="_blank" rel="noopener noreferrer" href="${camUrl(n.t.split(/\s+/)[0])}">Cambridge</a>`:""}</div>`).join("");
  const more=L.length>pg?`<button class="ghost more" data-m="${k}">Show ${Math.min(PG,L.length-pg)} more (${L.length-pg} left)</button>`:"";
  return `<details class="sec" data-s="${k}" ${open?"open":""}><summary>${k} <span class="cnt">${act?L.length+" of "+all.length:all.length}</span></summary>${L.length?items+more:`<p class="mute">No notes yet.</p>`}</details>`;
 }).join("");
 $("#nlist").innerHTML=html||`<p class="mute">${S.notes.length?"Nothing matches. Try a different word or filter.":"No notes yet. Add your first one above."}</p>`;
 $("#ncount").textContent=act?matches+" result"+(matches===1?"":"s")+" out of "+S.notes.length+" notes":S.notes.length+" note"+(S.notes.length===1?"":"s")+" in total";
 document.querySelectorAll("#nlist details").forEach(d=>d.ontoggle=()=>{if(!act){S.open[d.dataset.s]=d.open;save()}});
 document.querySelectorAll("#nlist [data-x]").forEach(b=>b.onclick=()=>{S.notes=S.notes.filter(n=>n.id!=b.dataset.x);save();renderList()});
 document.querySelectorAll("#nlist [data-m]").forEach(b=>b.onclick=()=>{S.pg[b.dataset.m]=(S.pg[b.dataset.m]||PG)+PG;renderList()});
}
function notes_(){
 S.notes=S.notes||[];S.open=S.open||{};S.pg=S.pg||{};S.tag=S.tag||"Mistake";S.nsk=S.nsk||"General";S.ns=S.ns||"new";
 const chips=(arr,key,cur)=>arr.map(t=>`<button class="chip" aria-pressed="${cur===t}" data-${key}="${t}">${t}</button>`).join("");
 $("#app").innerHTML=`<h1>Notes</h1><p class="mute">Save words, mistakes, tips and questions wherever you are.</p>
 <details class="sec" id="addn" ${!S.notes.length||S.addOpen?"open":""}><summary>Add a note</summary>
  <label id="sl">Category</label><div class="chips" role="group" aria-labelledby="sl">${chips(NS,"k",S.nsk)}</div>
  <label id="tl">Type</label><div class="chips" role="group" aria-labelledby="tl">${chips(NT,"g",S.tag)}</div>
  <label for="nt">Your note</label><textarea id="nt" placeholder="e.g. I keep mixing up affect and effect">${esc(S.draft||"")}</textarea>
  <button class="cta" style="margin:12px 0 10px" id="sn">Save to ${S.nsk}</button><p class="mute" id="sm" role="status"></p></details>
 <details class="sec" id="lkp" ${S.lkOpen?"open":""}><summary>Look up a word</summary>${wordForm()}</details>
 <label for="nq">Search your notes</label><input type="search" id="nq" value="${escA(S.nq||"")}" placeholder="Type a word or phrase">
 <div class="chips" style="margin-top:10px" role="group" aria-label="Filter by type"><button class="chip" aria-pressed="${!S.nt}" data-q="">All</button>${NT.map(t=>`<button class="chip" aria-pressed="${S.nt===t}" data-q="${t}">${t}</button>`).join("")}</div>
 <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0"><select id="nsort" aria-label="Sort" style="width:auto"><option value="new" ${S.ns==="new"?"selected":""}>Newest first</option><option value="old" ${S.ns==="old"?"selected":""}>Oldest first</option></select><button class="ghost" id="xa">Expand all</button><button class="ghost" id="ca">Collapse all</button></div>
 <p class="mute" id="ncount"></p><div id="nlist"></div>`;
 const ad=$("#addn"),lk=$("#lkp");ad.ontoggle=()=>{S.addOpen=ad.open;save()};lk.ontoggle=()=>{S.lkOpen=lk.open;save()};
 document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{S.draft=$("#nt").value;S.tag=b.dataset.g;S.addOpen=true;render()});
 document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{S.draft=$("#nt").value;S.nsk=b.dataset.k;S.addOpen=true;render()});
 document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{S.nt=b.dataset.q;S.pg={};render()});
 $("#nt").oninput=e=>{S.draft=e.target.value};
 let tm;$("#nq").oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{S.nq=e.target.value;S.pg={};renderList()},150)};
 $("#nsort").onchange=e=>{S.ns=e.target.value;renderList()};
 $("#xa").onclick=()=>{NS.forEach(k=>S.open[k]=true);save();renderList()};
 $("#ca").onclick=()=>{NS.forEach(k=>S.open[k]=false);save();renderList()};
 bindWF();
 $("#sn").onclick=()=>{const t=$("#nt").value.trim();if(!t){$("#nt").focus();return}S.notes.push({id:Date.now(),d:today(),g:S.tag,s:S.nsk,t});S.draft="";$("#nt").value="";save();$("#sm").textContent="Saved to "+S.nsk+".";renderList()};
 renderList();
}
let selW="",selT;
function hideSel(){clearTimeout(selT);$("#sel").classList.add("hidden")}
document.addEventListener("selectionchange",()=>{
 if(S.step!=="app"||(S.tab!=="notes"&&S.tab!=="today"))return;
 const ae=document.activeElement;let t="";
 if(ae&&(ae.tagName==="TEXTAREA"||ae.tagName==="INPUT")&&typeof ae.selectionStart==="number")t=ae.value.slice(ae.selectionStart,ae.selectionEnd);else t=String(getSelection());
 t=t.trim().replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,"");
 clearTimeout(selT);
 if(t&&t.length<=40&&!/\n/.test(t)){selW=t;$("#selw").textContent=t;$("#selc").href=camUrl(t);$("#sels").textContent="Save word";$("#sel").classList.remove("hidden")}
 else selT=setTimeout(hideSel,700);
});
$("#sel").addEventListener("mousedown",e=>e.preventDefault());
$("#sels").onclick=()=>{const r=addWord(selW);$("#sels").textContent=r===true?"Saved ✓":r==="dup"?"Already saved":"Save word";clearTimeout(selT);selT=setTimeout(hideSel,1500)};
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{hideSel();stopSpeak();S.tab=b.dataset.t;render();scrollTo(0,0)});
render();
</script></body></html>
